name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "research-os/**"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "scipy>=1.11"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run exp84 unlabeled-relation smoke benchmark
        run: |
          python experiments/exp84_unlabeled_relations.py \
            --train-frames 200 \
            --test-frames 100 \
            --out /tmp/exp84-results.json
          cat /tmp/exp84-results.json

      - name: Run exp85 anonymous-composition smoke benchmark
        run: |
          python experiments/exp85_anonymous_composition.py \
            --train-frames 120 \
            --induction-frames 50 \
            --heldout-frames 50 \
            --out /tmp/exp85-results.json
          cat /tmp/exp85-results.json
