name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "research-os/**"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "scipy>=1.11"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run exp84 unlabeled-relation smoke benchmark
        run: |
          python experiments/exp84_unlabeled_relations.py \
            --train-frames 200 \
            --test-frames 100 \
            --out /tmp/exp84-results.json
          cat /tmp/exp84-results.json

      - name: Run exp85 anonymous-composition smoke benchmark
        run: |
          python experiments/exp85_anonymous_composition.py \
            --train-frames 120 \
            --induction-frames 50 \
            --heldout-frames 50 \
            --out /tmp/exp85-results.json
          cat /tmp/exp85-results.json

      - name: Run exp86 compositional-utility benchmark
        run: |
          python experiments/exp86_compositional_utility.py \
            --train-frames 200 \
            --isolation-frames 100 \
            --induction-frames 60 \
            --heldout-frames 60 \
            --out /tmp/exp86-results.json
          cat /tmp/exp86-results.json

      - name: Run exp96 Personal Physics replay proof
        run: |
          python experiments/exp96_personal_physics_v0.py \
            --out /tmp/exp96-results.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/exp96-results.json"))
          assert all(
              item["entailed"]
              for item in data["derivations"].values()
          )
          assert data["retraction_check"][
              "dependent_conclusion_removed"
          ] is True
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Run exp97 adaptable attention proof
        run: |
          python experiments/exp97_attention_queue.py \
            --out /tmp/exp97-results.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/exp97-results.json"))
          assert data["hard_fact"]["unresolved_followup_person_a"] is True
          assert data["world_mutated_by_policy"] is False
          default_order = [
              item["person_id"]
              for item in data["default_policy"]["queue"]
          ]
          relationship_order = [
              item["person_id"]
              for item in data["relationship_first_policy"]["queue"]
          ]
          assert default_order != relationship_order
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Run exp98 world tensor and cognition proof
        run: |
          python experiments/exp98_world_cognition.py \
            --out /tmp/exp98-results.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/exp98-results.json"))
          assert data["travel_tensor_coordinate"]["minutes"] == 43.0
          assert data["hard_derivations"]["unresolved_followup"] is True
          assert data["hard_derivations"]["infeasible_transition"] is True
          assert data["attention_ranking"][0] == "person_a"
          assert data["cognitive_program"]["process_digest"]
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
